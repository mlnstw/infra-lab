apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test-app
  namespace: default
  labels:
    app: nginx-test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test-app
  template:
    metadata:
      labels:
        app: nginx-test-app
    spec:
      containers:
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.1
        args: ["-nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
        ports:
          - name: metrics
            containerPort: 9113
      - name: nginx
        image: mlnstw-test-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"