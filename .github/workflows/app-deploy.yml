name: Build, Push and Deploy (tag)

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ${{ secrets.YC_CONTAINER_REGISTRY }}
  IMAGE_NAME: mlnstw-test-app
  DEPLOYMENT_NAME: nginx-test-app
  NAMESPACE: default

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          ~/yandex-cloud/bin/yc version

      - name: Configure Yandex Cloud CLI
        run: |
          mkdir -p ~/.yandex
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > ~/.yandex/key.json
          yc config set service-account-key ~/.yandex/key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Get IAM token for Docker login
        id: iam-token
        run: |
          IAM_TOKEN=$(yc iam create-token)
          echo "token=$IAM_TOKEN" >> $GITHUB_OUTPUT

      - name: Login to Yandex Container Registry
        run: |
          echo "${{ steps.iam-token.outputs.token }}" | docker login \
            --username iam \
            --password-stdin \
            cr.yandex

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }} ./demo-app/app

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # ─── KUBECTL ЧЕРЕЗ yc get-credentials (без KUBE_CONFIG) ───
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubeconfig via YC CLI
        run: |
          yc managed-kubernetes cluster get-credentials \
            --name mlnstw-k8s \
            --external \
            --force
          kubectl auth can-i create deployment -n default

      # ─── ДЕПЛОЙ ───
      - name: Deploy manifests
        run: |
          # Подставляем реальный registry в манифест
          sed -i "s|\${REGISTRY}|${{ env.REGISTRY }}|g" demo-app/k8s/deployment.yaml
          kubectl apply -f demo-app/k8s/deployment.yaml
          kubectl apply -f demo-app/k8s/service.yaml
          kubectl apply -f demo-app/k8s/service-lb.yaml
          kubectl apply -f demo-app/k8s/grafana-lb.yaml

      - name: Update image to version
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            nginx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s