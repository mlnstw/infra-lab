name: Build and Push (master branch)

on:
  push:
    branches:
      - master
    paths:
      - "demo-app/app/**"
      - ".github/workflows/app-build.yml"
    tags-ignore:
      - "**"

env:
  REGISTRY: ${{ secrets.YC_CONTAINER_REGISTRY }}
  IMAGE_NAME: mlnstw-test-app

jobs:
  build-and-push:
    name: Build and Push Docker image (latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: demo-app/app/Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          ~/yandex-cloud/bin/yc version

      - name: Configure Yandex Cloud CLI
        run: |
          mkdir -p ~/.yandex
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > ~/.yandex/key.json
          yc config set service-account-key ~/.yandex/key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Get IAM token for Docker login
        id: iam-token
        run: |
          IAM_TOKEN=$(yc iam create-token)
          echo "token=$IAM_TOKEN" >> $GITHUB_OUTPUT

      - name: Login to Yandex Container Registry
        run: |
          echo "${{ steps.iam-token.outputs.token }}" | docker login \
            --username iam \
            --password-stdin \
            cr.yandex

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ./demo-app/app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
