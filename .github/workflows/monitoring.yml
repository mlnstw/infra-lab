name: Deploy Monitoring

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Infra Kubernetes"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
          ~/yandex-cloud/bin/yc version

      - name: Configure YC CLI
        run: |
          mkdir -p ~/.yandex
          echo '${{ secrets.YC_TERRAFORM_KEY_JSON }}' > ~/.yandex/key.json
          yc config set service-account-key ~/.yandex/key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Get kubeconfig
        run: |
          yc managed-kubernetes cluster get-credentials \
            --name mlnstw-k8s --external --force

      - name: Deploy kube-prometheus
        working-directory: terraform-infrastructure
        run: |
          chmod +x scripts/deploy-monitoring.sh
          ./scripts/deploy-monitoring.sh

      - name: Apply Grafana LB
        run: kubectl apply -f demo-app/k8s/grafana-lb.yaml

      - name: Wait for Grafana
        run: |
          kubectl -n monitoring rollout status deployment/grafana --timeout=300s || true
          kubectl -n monitoring get svc grafana-lb