name: Infra Kubernetes

on:
  push:
    branches: [master]
    paths:
      - "terraform-infrastructure/02-kubernetes/**"
      - ".github/workflows/infra-kubernetes.yml"
  pull_request:
    branches: [master]
    paths:
      - "terraform-infrastructure/02-kubernetes/**"
      - ".github/workflows/infra-kubernetes.yml"
  workflow_dispatch:

env:
  TF_VERSION: "1.8.4"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_generate_local_files: "false"

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-infrastructure/02-kubernetes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure YC credentials
        run: |
          mkdir -p ~/.yandex
          echo '${{ secrets.YC_TERRAFORM_KEY_JSON }}' > ~/.yandex/key.json
          echo "TF_VAR_service_account_key_file=$HOME/.yandex/key.json" >> $GITHUB_ENV
        working-directory: .

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan (PR)
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -input=false

      - name: Terraform Apply (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false